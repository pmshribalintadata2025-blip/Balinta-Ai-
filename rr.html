<script>
var firebaseConfig={apiKey:"AIzaSyAyAawamqC-6tIPk3B8haR7RoZd7r6afwM",authDomain:"balinta-pmshri-500.firebaseapp.com",databaseURL:"https://balinta-pmshri-500-default-rtdb.firebaseio.com",projectId:"balinta-pmshri-500",storageBucket:"balinta-pmshri-500.firebasestorage.app",messagingSenderId:"566070131344",appId:"1:566070131344:web:c8fbcf4432f9107a22f615",measurementId:"G-JGFM6CN98J"};try{firebase.initializeApp(firebaseConfig);var db=firebase.firestore();}catch(e){var db=null;}
var studs=JSON.parse(localStorage.getItem('studs')||'[]');var today=new Date().toISOString().slice(0,10);var att=JSON.parse(localStorage.getItem('att_'+today)||'{}');var attHistory=JSON.parse(localStorage.getItem('attHistory')||'{}');var holidays=JSON.parse(localStorage.getItem('holidays')||'{}');var lastSpokenName="",scanLock=false,lastFaceTime=0,isScanning=false,faceMatcher=null,labeledDescriptors=[],faceStayTimer=null,faceStaySeconds=0,currentStayName="",aiMode=false,recognition=null,aiIdleTimer=null,idleAnimTimer=null,blinkTimer=null,video=document.getElementById('mainCam'),addCapturedDescriptor=null,mainStream=null,addStream=null;
function speak(t,cb){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='gu-IN';u.rate=0.85;u.onend=()=>{if(cb)cb();};speechSynthesis.speak(u);}catch(e){if(cb)cb();}}
function isHoliday(d){var x=new Date(d);if(x.getDay()===0) return "રવિવાર - જાહેર રજા";return holidays[d]||null;}
function showPopup(n,m){var p=document.getElementById('popup');document.getElementById('popName').innerText=n;document.getElementById('popMsg').innerText=m;p.classList.add('show');setTimeout(()=>p.classList.remove('show'),2800);}
async function loadModels(){var CDN1='https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/weights';var CDN2='https://justadudewhohacks.github.io/face-api.js/models';var el=document.getElementById('statusText');try{el.innerText="⏳ Loading...";await faceapi.nets.tinyFaceDetector.loadFromUri(CDN1);await faceapi.nets.faceLandmark68Net.loadFromUri(CDN1);await faceapi.nets.faceRecognitionNet.loadFromUri(CDN1);el.innerText="✅ AI Ready - Camera ON";}catch(e1){try{el.innerText="⏳ Backup...";await faceapi.nets.tinyFaceDetector.loadFromUri(CDN2);await faceapi.nets.faceLandmark68Net.loadFromUri(CDN2);await faceapi.nets.faceRecognitionNet.loadFromUri(CDN2);el.innerText="✅ AI Ready (Backup)";}catch(e2){el.innerText="❌ Error: "+e2.message;return;}}loadLabeledImages();startIdleAnimation();checkSunday();renderGrid();autoStartCamera();}
function checkSunday(){var h=isHoliday(today);var el=document.getElementById('holidayInfo');if(h){if(el) el.innerText="📅 "+h+" - હાજરી બંધ";}else{if(el) el.innerText="";}}
async function loadLabeledImages(){labeledDescriptors=[];for(var s of studs){if(!s.descriptor) continue;try{labeledDescriptors.push(new faceapi.LabeledFaceDescriptors(s.name,[new Float32Array(s.descriptor)]));}catch(e){}} if(labeledDescriptors.length>0) faceMatcher=new faceapi.FaceMatcher(labeledDescriptors,0.45);else faceMatcher=null;}
function startIdleAnimation(){if(idleAnimTimer) clearInterval(idleAnimTimer);if(blinkTimer) clearInterval(blinkTimer);var irisL=document.getElementById('irisL'),irisR=document.getElementById('irisR');idleAnimTimer=setInterval(()=>{if(!irisL||!irisR) return;var x=(Math.random()*40-20),y=(Math.random()*28-14);irisL.style.transform=`translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;irisR.style.transform=`translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;},1500);blinkTimer=setInterval(()=>{document.querySelectorAll('.lid').forEach(l=>{l.style.transform='translateY(0)';setTimeout(()=>l.style.transform='translateY(-100%)',140);});},3000);}
function showScanningUI(){document.getElementById('idleEyes').style.opacity="0";document.getElementById('scanLine').style.display="block";video.style.opacity="1";}
function showIdleUI(){document.getElementById('idleEyes').style.opacity="1";document.getElementById('scanLine').style.display="none";video.style.opacity="0.45";}
async function startCamera(){var el=document.getElementById('statusText');try{if(mainStream) mainStream.getTracks().forEach(t=>t.stop());el.innerText="📷 Starting... Allow";var st=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});mainStream=st;video.srcObject=st;await video.play();el.innerText="✅ Camera ON - Scan દબાવો";showIdleUI();speak("બાલિન્ટા માં સ્વાગત છે, કેમેરો ચાલુ");}catch(e){el.innerText="❌ Camera Error";alert("Camera Allow કરો https પર - "+e.message);}}
async function startAddCam(){try{if(addStream) addStream.getTracks().forEach(t=>t.stop());var v=document.getElementById('addCamVideo');var s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}});addStream=s;v.srcObject=s;await v.play();}catch(e){alert(e.message);}}
async function autoStartCamera(){await startCamera();}
async function startAutoScan(){var h=isHoliday(today);if(h){alert(h);return;}if(!faceMatcher){alert("પહેલા ફોટા Add કરો");return;}if(!mainStream) await startCamera();isScanning=true;document.getElementById('statusText').innerText="🤖 Scan ON - 10s રહો -> AI";setInterval(async()=>{if(aiMode||scanLock||!isScanning) return;try{var det=await faceapi.detectSingleFace(video,new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();if(det){var best=faceMatcher.findBestMatch(det.descriptor);if(best.distance<0.45){showScanningUI();triggerAutoScan(best.label);}}else{showIdleUI();}},catch(e){}},650);}
function triggerAutoScan(name){if(!name||name=="unknown") return;var now=Date.now();if(now-lastFaceTime<2800 && name==lastSpokenName) return;lastFaceTime=now;if(att[name]){onFaceStayDetected(name,10);return;}scanLock=true;lastSpokenName=name;att[name]=true;localStorage.setItem('att_'+today,JSON.stringify(att));if(db) db.collection("attendance").doc(today+"_"+name).set({name:name,date:today});showPopup(name,"હાજરી પુરાઈ!");speak("સરસ "+name+" હાજરી પુરાઈ!",()=>{scanLock=false;});renderGrid();}
function onFaceStayDetected(name,sec){if(aiMode) return;if(currentStayName!=name){currentStayName=name;faceStaySeconds=0;clearInterval(faceStayTimer);faceStayTimer=setInterval(()=>{faceStaySeconds++;document.getElementById('statusText').innerText=name+" "+faceStaySeconds+"s/"+sec+"s";if(faceStaySeconds>=sec){clearInterval(faceStayTimer);askToTalk(name);}},1000);}}
function askToTalk(name){scanLock=true;speak(name+" મજામાં? હા બોલ તો વાત કરીએ!",()=>{var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){scanLock=false;return;}var rec=new SR();rec.lang='gu-IN';rec.start();document.getElementById('statusText').innerText="🎤 બોલો હા કે ના?";var to=setTimeout(()=>{try{rec.stop();}catch(e){}scanLock=false;showIdleUI();},6000);rec.onresult=(e)=>{clearTimeout(to);var txt=e.results[0][0].transcript.toLowerCase();if(txt.includes("હા")||txt.includes("ha")||txt.includes("yes")) enterAIMode(name);else{scanLock=false;showIdleUI();}};});}
function enterAIMode(name){aiMode=true;document.getElementById('aiOverlay').style.display="flex";document.getElementById('aiName').innerText="હેલો "+name+"! 🤖";document.getElementById('aiStatus').innerText="💬 પૂછો!";speak("હેલો "+name+"! બોલ શું પૂછવું છે?",()=>{startListening(name);});}
function startListening(n){var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR) return;recognition=new SR();recognition.lang='gu-IN';recognition.onstart=()=>{document.getElementById('aiStatus').innerText="🎤 સાંભળું છું...";};recognition.onresult=(e)=>{var q=e.results[0][0].transcript;document.getElementById('aiQuestion').innerText=q;var d=studs.find(s=>s.name==n)||{};var ql=q.toLowerCase();var ans=ql.includes("નામ")?`તારું નામ ${n} છે!`:ql.includes("જન્મ")?`જન્મ ${d.dob||'2018'}!`:ql.includes("શાળા")?`પીએમ શ્રી બાલિન્ટા!`:ql.includes("રજા")?isHoliday(today)||"રજા નથી!":`સરસ સવાલ ${n}!`;document.getElementById('aiStatus').innerText="🤔...";speak(ans,()=>{if(aiMode){document.getElementById('aiStatus').innerText="બીજું પૂછો!";setTimeout(()=>{if(aiMode) startListening(n);},800);}});};recognition.onerror=()=>{setTimeout(()=>{if(aiMode) startListening(n);},1000);};try{recognition.start();}catch(e){}}
function exitAIMode(){aiMode=false;scanLock=false;clearInterval(faceStayTimer);if(recognition) try{recognition.stop();}catch(e){}document.getElementById('aiOverlay').style.display="none";showIdleUI();isScanning=true;lastSpokenName="";document.getElementById('statusText').innerText="✅ AI બંધ";}
function openHolidayModal(){document.getElementById('holidayModal').style.display='flex';renderHolidayList();}
function renderHolidayList(){var list=document.getElementById('holidayList');list.innerHTML="";var keys=Object.keys(holidays).sort();if(keys.length==0) list.innerHTML="કોઈ રજા નથી";keys.forEach(d=>{var div=document.createElement('div');div.style.cssText="background:rgba(255,255,255,0.1);padding:8px;border-radius:8px;margin-bottom:6px;display:flex;justify-content:space-between";div.innerHTML=`<span>📅 ${d} - ${holidays[d]}</span><button onclick="deleteHoliday('${d}')" style="background:#FF3B30;color:white;border:none;padding:4px 8px;border-radius:6px">🗑️</button>`;list.appendChild(div);});}
function addHoliday(){var d=document.getElementById('holDate').value;var r=document.getElementById('holReason').value||"જાહેર રજા";if(!d){alert("તારીખ");return;}holidays[d]=r;localStorage.setItem('holidays',JSON.stringify(holidays));renderHolidayList();checkSunday();alert("✅ "+d);if(db) db.collection("holidays").doc(d).set({date:d,reason:r});}
function deleteHoliday(d){if(!confirm(d+" કાઢવી?")) return;delete holidays[d];localStorage.setItem('holidays',JSON.stringify(holidays));renderHolidayList();checkSunday();if(db) db.collection("holidays").doc(d).delete();}
function showBirthdays(){var todayMD=new Date().toISOString().slice(5,10);var todays=studs.filter(s=>s.dob&&s.dob.slice(5,10)===todayMD);var msg="🎂 આજના - "+today+"\n";if(todays.length==0) msg+="કોઈ નથી\n"; else todays.forEach(s=>{msg+=`🎉 ${s.name}\n`;});alert(msg);if(todays.length>0) speak(`આજે ${todays.length} નો જન્મદિવસ!`);}
function openPrincipalDash(){document.getElementById('principalDash').style.display='flex';var total=studs.length,present=Object.keys(att).length,per=total?Math.round(present/total*100):0;document.getElementById('dashTotal').innerText=total;document.getElementById('dashPresent').innerText=present;document.getElementById('dashPer').innerText=per+"%";var by={};studs.forEach(s=>{var c=s.class||"1";if(!by[c]) by[c]={t:0,p:0};by[c].t++;if(att[s.name]) by[c].p++;});var cw=document.getElementById('dashClassWise');cw.innerHTML="<b>📊 Class Wise %</b><br>";for(var k in by){var d=by[k];var p=d.t?Math.round(d.p/d.t*100):0;cw.innerHTML+=`<div style="display:flex;justify-content:space-between;padding:4px 0"><span>Class ${k}: ${d.p}/${d.t}</span><span style="background:${p>=75?'#00AA55':'#FF6F00'};padding:2px 8px;border-radius:10px">${p}%</span></div>`;}var todayMD=new Date().toISOString().slice(5,10);var todays=studs.filter(s=>s.dob&&s.dob.slice(5,10)===todayMD);document.getElementById('dashBirthday').innerHTML=todays.length?`🎂 ${todays.map(s=>s.name).join(", ")}`:"🎂 કોઈ નથી";document.getElementById('dashHolidayInfo').innerHTML=isHoliday(today)?`📅 ${isHoliday(today)}`:"📅 રજા નથી";}
function openAddModal(){document.getElementById('addModal').style.display="flex";}
function closeAddModal(){document.getElementById('addModal').style.display="none";if(addStream) addStream.getTracks().forEach(t=>t.stop());}
function capturePhoto(){var v=document.getElementById('addCamVideo');var c=document.getElementById('addCanvas');if(!v.videoWidth){alert("Camera ON");return;}c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);c.toBlob(async blob=>{var url=URL.createObjectURL(blob);var imgEl=document.getElementById('capturedImg');imgEl.src=url;imgEl.style.display="block";try{var img=await faceapi.bufferToImage(blob);var det=await faceapi.detectSingleFace(img,new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();if(!det){alert("ચહેરો નથી");return;}addCapturedDescriptor=Array.from(det.descriptor);alert("✅ Face OK!");}catch(e){alert(e.message);}},'image/jpeg');}
async function addStudent(){var name=document.getElementById('addName').value.trim(),cls=document.getElementById('addClass').value.trim(),gender=document.getElementById('addGender').value,dob=document.getElementById('addDob').value,file=document.getElementById('addPhoto').files[0],desc=null;if(addCapturedDescriptor) desc=addCapturedDescriptor;else if(file){try{var img=await faceapi.bufferToImage(file);var det=await faceapi.detectSingleFace(img,new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();if(!det){alert("ચહેરો નથી");return;}desc=Array.from(det.descriptor);}catch(e){alert(e.message);return;}}else{alert("Capture કરો");return;}if(!name||!dob){alert("નામ + DOB");return;}var ns={uid:Date.now().toString(),name:name,class:cls||"1",gender:gender,dob:dob,descriptor:desc,contact:document.getElementById('addContact').value};studs.push(ns);localStorage.setItem('studs',JSON.stringify(studs));if(db) await db.collection("students").doc(ns.uid).set(ns);loadLabeledImages();renderGrid();alert("✅ "+name);closeAddModal();addCapturedDescriptor=null;}
function bulkAddStudents(){var file=document.getElementById('bulkFile').files[0];if(!file){alert("CSV");return;}var reader=new FileReader();reader.onload=async function(e){var lines=e.target.result.split('\n');var added=0;for(var i=1;i<lines.length;i++){var line=lines[i].trim();if(!line) continue;var cols=line.split(',');var name=(cols[0]||'').trim();if(!name) continue;var cls=(cols[1]||'1').trim()||'1';var gender=(cols[2]||'boy').trim().toLowerCase();if(gender!='boy'&&gender!='girl') gender='boy';var dob=(cols[3]||'2018-01-01').trim();var ns={uid:Date.now().toString()+"_"+i+"_"+Math.random().toString(36).slice(2),name:name,class:cls,gender:gender,dob:dob,descriptor:null};studs.push(ns);if(db) await db.collection("students").doc(ns.uid).set(ns).catch(()=>{});added++;}localStorage.setItem('studs',JSON.stringify(studs));alert("✅ "+added);renderGrid();document.getElementById('bulkSec').style.display='none';};reader.readAsText(file);}
function fixAllUndefined(){var f=0;studs.forEach(s=>{if(!s.gender||s.gender=='undefined'){s.gender='boy';f++;}if(!s.dob||s.dob=='undefined'||!s.dob){s.dob='2018-01-01';f++;}});localStorage.setItem('studs',JSON.stringify(studs));alert("🔧 "+f);renderGrid();}
function editStudent(uid){var s=studs.find(x=>x.uid==uid);if(!s) return;var nn=prompt("નામ:",s.name);if(nn===null) return;s.name=nn||s.name;localStorage.setItem('studs',JSON.stringify(studs));renderGrid();}
function deleteStudent(uid){var s=studs.find(x=>x.uid==uid);if(!confirm(s.name+" Delete?")) return;studs=studs.filter(x=>x.uid!=uid);localStorage.setItem('studs',JSON.stringify(studs));delete att[s.name];localStorage.setItem('att_'+today,JSON.stringify(att));renderGrid();}
function renderGrid(){var list=document.getElementById('activityList');if(!list) return;list.innerHTML="";var total=studs.length,present=Object.keys(att).length;document.getElementById('presentCount').innerText=present;document.getElementById('onTimeCount').innerText=present;document.getElementById('lateCount').innerText=total-present;document.getElementById('avgPer').innerText=(total?Math.round(present/total*100):0)+"%";if(!studs.length){list.innerHTML="<div style='color:#6EBFFF;text-align:center;padding:20px'>કોઈ નથી +ADD કરો</div>";return;}studs.forEach(s=>{var isP=att[s.name];var div=document.createElement('div');div.style.cssText="background:white;color:#111;border-radius:12px;padding:10px;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px";div.innerHTML=`<div style='display:flex;align-items:center'><div style='width:36px;height:36px;border-radius:50%;background:${isP?'#2E7D32':'#EF6C00'};color:white;display:flex;align-items:center;justify-content:center;font-weight:700;margin-right:8px'>${s.name.substring(0,2).toUpperCase()}</div><div><b style='font-size:12px'>${s.name}</b><br><small style='opacity:0.6'>${s.class||''}•${s.gender||'boy'}</small></div></div><div style='display:flex;gap:4px'><button onclick="editStudent('${s.uid}')" style='padding:6px 8px;border:none;border-radius:8px;background:#0066FF;color:white'>✏️</button><button onclick="deleteStudent('${s.uid}')" style='padding:6px 8px;border:none;border-radius:8px;background:#FF3B30;color:white'>🗑️</button></div>`;list.appendChild(div);});}
function filterList(q){q=q.toLowerCase().trim();var list=document.getElementById('activityList');if(!q){renderGrid();return;}list.innerHTML="";var filtered=studs.filter(s=>s.name.toLowerCase().includes(q));filtered.forEach(s=>{var div=document.createElement('div');div.style.cssText="background:white;color:#111;border-radius:12px;padding:10px;margin-bottom:6px";div.innerText=s.name;list.appendChild(div);});}
function renderClassWise(){var by={};studs.forEach(s=>{var c=s.class||"1";if(!by[c]) by[c]={t:0,p:0};by[c].t++;if(att[s.name]) by[c].p++;});var m="📊 Class Wise\n\n";for(var k in by){var d=by[k];m+=`Class ${k}: ${d.p}/${d.t} = ${d.t?Math.round(d.p/d.t*100):0}%\n`;}alert(m);}
function sendTeacherReport(t){var total=studs.length,present=Object.keys(att).length;var msg=`🏫 BALINTA ${t}\nTotal: ${total}, Present: ${present}`;window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`,'_blank');}
window.addEventListener('load',()=>{loadModels();});
</script></body></html>
